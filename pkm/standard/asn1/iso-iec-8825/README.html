<h1 id="asn1">ASN1 编码规则</h1>
<p><strong>ASN1（Abstract Syntax Notation One）</strong> 是一种用于描述数据结构及其编码规则的标准化语言，广泛应用于通信协议（如电信、网络管理、PKI 等）。</p>
<p>本模块目前包含三部分：</p>
<ul>
<li><strong>8824 标准</strong> — 定义 ASN1 的<strong>抽象语法</strong>，即如何用正式记号描述数据结构。</li>
<li><strong>8825 标准</strong> — 定义 ASN1 的<strong>编码规则</strong>，即如何将抽象语法映射为实际的字节序列（如 BER、DER、CER 等）。</li>
<li><strong>《asn1-complet》</strong> — 一本系统讲解 ASN1 的综合性书籍，涵盖语法、编码、工具和实践。</li>
</ul>
