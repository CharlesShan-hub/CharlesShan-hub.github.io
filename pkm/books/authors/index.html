<script>
(function () {
  "use strict";
  var DATA = window.PKM_AUTHORS || [];
  var S = { q: "", key: "name", asc: true };
  var $search = document.getElementById("au-search");
  var $tbody = document.querySelector("#au-table tbody");
  var $ths = Array.prototype.slice.call(document.querySelectorAll("#au-table th[data-k]"));
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function filtered() {
    var q = S.q.trim().toLowerCase();
    return DATA.filter(function (a) {
      if (q && (a.name + " " + a.orig + " " + a.id).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
  }
  function render() {
    var rows = filtered();
    var k = S.key, asc = S.asc;
    rows.sort(function (a, b) {
      var va = a[k], vb = b[k];
      var na = typeof va === "number", nb = typeof vb === "number";
      var c;
      if (na && nb) c = va - vb;
      else if (na) c = -1;
      else if (nb) c = 1;
      else c = String(va || "").localeCompare(String(vb || ""), "zh");
      return asc ? c : -c;
    });
    var html = "";
    for (var i = 0; i < rows.length; i++) {
      var a = rows[i];
      html += "<tr>" +
        '<td><a href="' + esc(a.id) + '/README.html">' + esc(a.name) + "</a></td>" +
        "<td>" + esc(a.orig) + "</td>" +
        "<td>" + esc(a.id) + "</td>" +
        '<td class="num">' + a.count + "</td>" +
        "</tr>";
    }
    $tbody.innerHTML = html || '<tr><td colspan="4" class="empty">没有匹配的作者</td></tr>';
  }
  $ths.forEach(function (th) {
    th.addEventListener("click", function () {
      var k = th.getAttribute("data-k");
      if (S.key === k) S.asc = !S.asc; else { S.key = k; S.asc = true; }
      $ths.forEach(function (t) {
        t.classList.toggle("sorted", t === th);
        t.querySelector(".bk-sort").textContent = (t === th) ? (S.asc ? "▲" : "▼") : "";
      });
      render();
    });
  });
  $search.addEventListener("input", function () { S.q = $search.value; render(); });
  render();
})();
</script>
