<script>
(function () {
  "use strict";
  var PB = window.PKMBooks;
  var DATA = window.PKM_BOOKS || [];
  var CATS = window.PKM_CATS || [];
  var S = { q: "", genre: "", cat: "", status: "", rate: {}, key: "name", asc: true, hover: "", path: [] };
  var $search = document.getElementById("bk-search");
  var $trigger = document.getElementById("bk-cat-trigger");
  var $label = document.getElementById("bk-cat-label");
  var $panel = document.getElementById("bk-cat-panel");
  var $roots = document.getElementById("bk-cat-roots");
  var $children = document.getElementById("bk-cat-children");
  var $tbody = document.querySelector("#bk-table tbody");
  var $ths = Array.prototype.slice.call(document.querySelectorAll("#bk-table th[data-k]"));
  // 口径树：大类序 ROOTS、子口径 CHILDREN{rootId:[...]}、归属 PARENT{id:parent}
  var ROOTS = [], CHILDREN = {}, PARENT = {}, NAMES = {};
  CATS.forEach(function (c) {
    NAMES[c.id] = c.name;
    PARENT[c.id] = c.parent;
    if (c.parent) (CHILDREN[c.parent] = CHILDREN[c.parent] || []).push(c);
    else ROOTS.push(c);
  });
  function catName(id) {
    return id ? (NAMES[id] || id) : "全部口径";
  }
  // blId 是否属于 cat 的任意后代（含自身）：沿 PARENT 链向上找
  function isDesc(blId, cat) {
    while (blId && blId !== cat) blId = PARENT[blId];
    return blId === cat;
  }
  function filtered() {
    var q = S.q.trim().toLowerCase();
    return DATA.filter(function (b) {
      var blnames = (b.booklists || []).map(function (bl) { return bl.name; }).join(" ");
      if (q && (b.name + " " + b.author + " " + b.genre + " " + blnames).toLowerCase().indexOf(q) < 0) return false;
      if (S.genre && b.genre !== S.genre) return false;
      if (S.cat) {
        var hit = (b.booklists || []).some(function (bl) {
          return isDesc(bl.id, S.cat);
        });
        if (!hit) return false;
      }
      if (S.status === "read" && !(b.count >= 1)) return false;
      if (S.status === "unread" && b.count >= 1) return false;
      // 评分维度筛选：点亮某维度 = 该维度为 1（亮星），多选取交集（AND）
      for (var i in S.rate) {
        if ((b.ratings || [])[i] !== 1) return false;
      }
      return true;
    });
  }
  // 按亮星总数排序（评分列排序用）
  function ratingOn(b) {
    return (b.ratings || []).filter(function (v) { return v === 1; }).length;
  }
  function renderRoots() {
    var html = '<div class="pkm-cat-item' + (S.cat ? "" : " sel") + '" data-id="">全部口径</div>';
    ROOTS.forEach(function (r) {
      html += '<div class="pkm-cat-item' + (S.hover === r.id ? " hover" : "") + '" data-id="' +
        PB.esc(r.id) + '">' + PB.esc(r.name) + '</div>';
    });
    $roots.innerHTML = html;
  }
  function renderChildren() {
    if (!S.hover) {
      $children.innerHTML = '<div class="pkm-cat-item muted">先选左侧大类</div>';
      return;
    }
    var cur = S.path.length ? S.path[S.path.length - 1] : S.hover;
    var html = '';
    if (S.path.length) {
      html += '<div class="pkm-cat-item back" data-back="1">← ' + PB.esc(catName(cur)) + '</div>';
    }
    html += '<div class="pkm-cat-item' + (S.cat === cur ? " sel" : "") +
      '" data-id="' + PB.esc(cur) + '" data-all="1">全部</div>';
    (CHILDREN[cur] || []).forEach(function (c) {
      var sub = (CHILDREN[c.id] || []).length;
      html += '<div class="pkm-cat-item' + (S.cat === c.id ? " sel" : "") +
        '" data-id="' + PB.esc(c.id) + '">' + PB.esc(c.name) +
        (sub ? '<span class="pkm-cat-sub">▸</span>' : '') + '</div>';
    });
    $children.innerHTML = html;
  }
  function openPanel() {
    clearTimeout(hideTimer);
    $panel.classList.add("open");
    if (!S.hover && ROOTS.length) S.hover = ROOTS[0].id;
    S.path = [];
    renderRoots();
    renderChildren();
  }
  function closePanel() { $panel.classList.remove("open"); }
  var hideTimer = null;
  function scheduleClose() { clearTimeout(hideTimer); hideTimer = setTimeout(closePanel, 150); }
  function makeRow(b) {
    var r = PB.stars(b.ratings);
    var mat = b.material ? '<a href="' + PB.esc(b.material) + '" target="_blank" rel="noopener">资料</a>' : "";
    var author = b.authorId ? '<a href="authors/' + PB.esc(b.authorId) + '/README.html">' + PB.esc(b.author) + "</a>" : PB.esc(b.author);
    var name = b.bookId ? '<a href="authors/' + PB.esc(b.authorId) + '/' + PB.esc(b.bookId) + '/README.html">' + PB.esc(b.name) + "</a>" : PB.esc(b.name);
    var bls = (b.booklists || []).map(function (bl) {
      return '<a href="booklist/' + PB.esc(bl.path || bl.id) + '/README.html">' + PB.esc(bl.name) + "</a>";
    }).join(", ");
    return "<tr>" +
      "<td>" + name + "</td>" +
      "<td>" + author + "</td>" +
      "<td>" + PB.esc(b.genre) + "</td>" +
      '<td class="num">' + b.count + "</td>" +
      '<td class="num">' + r + "</td>" +
      "<td>" + mat + "</td>" +
      "<td>" + bls + "</td>" +
      "</tr>";
  }
  function render() {
    var rows = PB.sort(filtered(), S, function (b, key) {
      return key === "rating" ? ratingOn(b) : b[key];
    });
    PB.fill($tbody, rows, makeRow, '<tr><td colspan="7" class="empty">没有匹配的书</td></tr>');
    $label.textContent = catName(S.cat);
  }
  $trigger.addEventListener("click", function () {
    if ($panel.classList.contains("open")) closePanel(); else openPanel();
  });
  $trigger.addEventListener("mouseenter", openPanel);
  $trigger.addEventListener("mouseleave", scheduleClose);
  $panel.addEventListener("mouseenter", function () { clearTimeout(hideTimer); });
  $panel.addEventListener("mouseleave", scheduleClose);
  $roots.addEventListener("mouseover", function (e) {
    var it = e.target.closest(".pkm-cat-item");
    if (!it) return;
    S.hover = it.getAttribute("data-id") || "";
    S.path = [];
    renderRoots();
    renderChildren();
  });
  $roots.addEventListener("click", function (e) {
    var it = e.target.closest(".pkm-cat-item");
    if (!it) return;
    S.hover = it.getAttribute("data-id") || "";
    S.path = [];
    if (!S.hover) { S.cat = ""; closePanel(); render(); return; }
    renderRoots();
    renderChildren();
  });
  $children.addEventListener("click", function (e) {
    var it = e.target.closest(".pkm-cat-item");
    if (!it) return;
    if (it.getAttribute("data-back")) { S.path.pop(); renderChildren(); return; }
    var cur = S.path.length ? S.path[S.path.length - 1] : S.hover;
    var id = it.getAttribute("data-id");
    if (!id) return;
    if (it.getAttribute("data-all")) { S.cat = cur; closePanel(); render(); return; }
    if ((CHILDREN[id] || []).length) { S.path.push(id); renderChildren(); return; }
    S.cat = id;
    closePanel();
    render();
  });
  PB.bindSort($ths, S, render);
  $search.addEventListener("input", function () { S.q = $search.value; render(); });
  PB.dd(document.getElementById("bk-genre-dd"), function (v) { S.genre = v; render(); });
  PB.dd(document.getElementById("bk-status-dd"), function (v) { S.status = v; render(); });
  PB.rateDD(document.getElementById("bk-rating-dd"), function (sel) {
    S.rate = {};
    sel.forEach(function (i) { S.rate[i] = true; });
    render();
  });
  render();
})();
</script>
