<script>
(function () {
  "use strict";
  var PB = window.PKMBooks;
  var DATA = window.PKM_BOOKS || [];
  var S = { q: "", rating: "", key: "name", asc: true };
  var $search = document.getElementById("bk-search");
  var $rating = document.getElementById("bk-rating");
  var $tbody = document.querySelector("#bk-table tbody");
  var $ths = Array.prototype.slice.call(document.querySelectorAll("#bk-table th[data-k]"));
  function filtered() {
    var q = S.q.trim().toLowerCase();
    return DATA.filter(function (b) {
      if (q && (b.name + " " + b.author + " " + b.genre).toLowerCase().indexOf(q) < 0) return false;
      if (S.rating) {
        var op = S.rating.charAt(0), n = parseInt(S.rating.slice(1), 10);
        if (b.rating == null) return false;
        if (op === "=" && b.rating !== n) return false;
        if (op === ">" && b.rating <= n) return false;
        if (op === "<" && b.rating >= n) return false;
      }
      return true;
    });
  }
  function makeRow(b) {
    var r = PB.stars(b.rating);
    var mat = b.material ? '<a href="' + PB.esc(b.material) + '" target="_blank" rel="noopener">资料</a>' : "";
    var author = b.authorId ? '<a href="../../authors/' + PB.esc(b.authorId) + '/README.html">' + PB.esc(b.author) + "</a>" : PB.esc(b.author);
    var name = b.bookId ? '<a href="../../authors/' + PB.esc(b.authorId) + '/' + PB.esc(b.bookId) + '/README.html">' + PB.esc(b.name) + "</a>" : PB.esc(b.name);
      var blcell = "";
    return "<tr>" +
      "<td>" + name + "</td>" +
      "<td>" + author + "</td>" +
      "<td>" + PB.esc(b.genre) + "</td>" +
      '<td class="num">' + b.count + "</td>" +
      '<td class="num">' + r + "</td>" +
      "<td>" + mat + "</td>" +
      blcell +
      "</tr>";
  }
  function render() {
    var rows = PB.sort(filtered(), S);
    PB.fill($tbody, rows, makeRow, '<tr><td colspan="6" class="empty">没有匹配的书</td></tr>');
  }
  PB.bindSort($ths, S, render);
  $search.addEventListener("input", function () { S.q = $search.value; render(); });
  $rating.addEventListener("change", function () { S.rating = $rating.value; render(); });
  render();
})();
</script>
