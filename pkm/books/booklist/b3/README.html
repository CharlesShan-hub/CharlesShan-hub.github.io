<script>
(function () {
  "use strict";
  var DATA = window.PKM_BOOKS || [];
  var S = { q: "", key: "name", asc: true };
  var $search = document.getElementById("bk-search");
  var $tbody = document.querySelector("#bk-table tbody");
  var $ths = Array.prototype.slice.call(document.querySelectorAll("#bk-table th[data-k]"));
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function stars(n) {
    if (n == null || n < 1) return "";
    if (n > 5) n = 5;
    var s = "";
    for (var i = 0; i < n; i++) s += "★";
    return '<span class="bk-stars">' + s + "</span>";
  }
  function filtered() {
    var q = S.q.trim().toLowerCase();
    return DATA.filter(function (b) {
      if (q && (b.name + " " + b.author + " " + b.genre).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
  }
  function render() {
    var rows = filtered();
    var k = S.key, asc = S.asc;
    rows.sort(function (a, b) {
      var va = a[k], vb = b[k];
      var na = typeof va === "number", nb = typeof vb === "number";
      var c;
      if (na && nb) c = va - vb;
      else if (na) c = -1;
      else if (nb) c = 1;
      else c = String(va || "").localeCompare(String(vb || ""), "zh");
      return asc ? c : -c;
    });
    var html = "";
    for (var i = 0; i < rows.length; i++) {
      var b = rows[i];
      var r = stars(b.rating);
      var mat = b.material ? '<a href="' + esc(b.material) + '" target="_blank" rel="noopener">资料</a>' : "";
      var author = b.authorId ? '<a href="../../authors/' + esc(b.authorId) + '/README.html">' + esc(b.author) + "</a>" : esc(b.author);
      var name = b.bookId ? '<a href="../../authors/' + esc(b.authorId) + '/' + esc(b.bookId) + '/README.html">' + esc(b.name) + "</a>" : esc(b.name);
      var blcell = "";
      html += "<tr>" +
        "<td>" + name + "</td>" +
        "<td>" + author + "</td>" +
        "<td>" + esc(b.genre) + "</td>" +
        '<td class="num">' + b.count + "</td>" +
        '<td class="num">' + r + "</td>" +
        "<td>" + mat + "</td>" +
        blcell +
        "</tr>";
    }
    $tbody.innerHTML = html || '<tr><td colspan="6" class="empty">没有匹配的书</td></tr>';
  }
  $ths.forEach(function (th) {
    th.addEventListener("click", function () {
      var k = th.getAttribute("data-k");
      if (S.key === k) S.asc = !S.asc; else { S.key = k; S.asc = true; }
      $ths.forEach(function (t) {
        t.classList.toggle("sorted", t === th);
        t.querySelector(".bk-sort").textContent = (t === th) ? (S.asc ? "▲" : "▼") : "";
      });
      render();
    });
  });
  $search.addEventListener("input", function () { S.q = $search.value; render(); });
  render();
})();
