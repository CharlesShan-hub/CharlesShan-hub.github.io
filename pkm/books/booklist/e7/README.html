<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>传记纪实</title>
<link id="theme-css" rel="stylesheet" href="../../../themes/phycat-abyss.css">
<link rel="stylesheet" href="../../../ui.css?v=f124b6a0">
</head>
<body class="done">

<div id="pkm-content">

<style>
.pkm-books { max-width: 1500px; }
.pkm-books h1 { margin: 8px 0 4px; }
.pkm-books .pkm-books-stats { margin: 0 0 14px; font-size: 14px; opacity: .75; }
.pkm-books .pkm-books-stats b { opacity: 1; }
.pkm-books-tools { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.pkm-books-tools input, .pkm-books-tools select {
  font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 7px;
  border: 1px solid color-mix(in srgb, currentColor 35%, transparent);
  background: color-mix(in srgb, currentColor 5%, transparent);
  color: inherit; outline: none;
}
.pkm-books-tools input:focus, .pkm-books-tools select:focus {
  border-color: color-mix(in srgb, currentColor 70%, transparent);
}
/* 下拉面板原生渲染不跟随主题，显式设背景色，避免暗色主题下亮字配亮底看不清 */
.pkm-books-tools select option {
  background: var(--bg-color, #ffffff);
  color: var(--text-color, currentColor);
}
.pkm-books-tools input { min-width: 220px; flex: 1; }
.pkm-books table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.pkm-books th { text-align: left; white-space: nowrap; cursor: pointer; user-select: none;
  padding: 7px 10px; border-bottom: 2px solid color-mix(in srgb, currentColor 25%, transparent); }
.pkm-books th .bk-sort { font-size: 11px; opacity: .5; margin-left: 3px; }
.pkm-books th.sorted .bk-sort { opacity: 1; }
.pkm-books td { padding: 6px 10px; border-bottom: 1px solid color-mix(in srgb, currentColor 10%, transparent); }
.pkm-books tbody tr:hover td { background: color-mix(in srgb, currentColor 6%, transparent); }
.pkm-books td.num, .pkm-books th.num { text-align: right; }
.pkm-books td.bl-root a { font-weight: 600; }
.pkm-books td.bl-child { padding-left: 26px; }
.pkm-booklist-nav { margin: 0 0 14px; display: flex; flex-wrap: wrap; gap: 8px; }
.pkm-booklist-nav .bl-chip { padding: 6px 12px; border-radius: 999px; font-size: 13px;
  border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
  background: color-mix(in srgb, currentColor 5%, transparent);
  text-decoration: none; color: inherit; }
.pkm-booklist-nav .bl-chip span { opacity: .6; margin-left: 4px; font-size: 12px; }
.pkm-booklist-nav .bl-chip:hover { border-color: color-mix(in srgb, currentColor 60%, transparent); }
.pkm-books .empty { text-align: center; opacity: .5; padding: 30px 0; }
</style>

<style>
.pkm-booklist-intro {
  margin: 0 0 16px; padding: 12px 16px;
  border: 1px solid color-mix(in srgb, currentColor 15%, transparent);
  border-radius: 8px; font-size: 14px; line-height: 1.7;
}
.pkm-booklist-intro > :first-child { margin-top: 0; }
.pkm-booklist-intro > :last-child { margin-bottom: 0; }
</style>
<div class="pkm-books">
  <h1>传记纪实</h1>
  <p class="pkm-books-stats">共 <b>0</b> 本 · 已读 <b>0</b> · 未读 <b>0</b></p>
  
  
  <div class="pkm-books-tools">
    <input id="bk-search" type="search" placeholder="搜索书名 / 作者 / 体裁…" autocomplete="off">
  </div>
  <table id="bk-table">
    <thead><tr>
      <th data-k="name" class="sorted">书名<span class="bk-sort">▲</span></th>
      <th data-k="author">作者<span class="bk-sort"></span></th>
      <th data-k="genre">体裁<span class="bk-sort"></span></th>
      <th data-k="count" class="num">次数<span class="bk-sort"></span></th>
      <th data-k="rating" class="num">评分<span class="bk-sort"></span></th>
      <th>资料</th>
      
    </tr></thead>
    <tbody></tbody>
  </table>
</div>
<script>window.PKM_BOOKS = [];</script>
<script>
(function () {
  "use strict";
  var DATA = window.PKM_BOOKS || [];
  var S = { q: "", key: "name", asc: true };
  var $search = document.getElementById("bk-search");
  var $tbody = document.querySelector("#bk-table tbody");
  var $ths = Array.prototype.slice.call(document.querySelectorAll("#bk-table th[data-k]"));
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function stars(n) {
    if (n == null || n < 1) return "";
    if (n > 5) n = 5;
    var s = "";
    for (var i = 0; i < n; i++) s += "★";
    return '<span class="bk-stars">' + s + "</span>";
  }
  function filtered() {
    var q = S.q.trim().toLowerCase();
    return DATA.filter(function (b) {
      if (q && (b.name + " " + b.author + " " + b.genre).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
  }
  function render() {
    var rows = filtered();
    var k = S.key, asc = S.asc;
    rows.sort(function (a, b) {
      var va = a[k], vb = b[k];
      var na = typeof va === "number", nb = typeof vb === "number";
      var c;
      if (na && nb) c = va - vb;
      else if (na) c = -1;
      else if (nb) c = 1;
      else c = String(va || "").localeCompare(String(vb || ""), "zh");
      return asc ? c : -c;
    });
    var html = "";
    for (var i = 0; i < rows.length; i++) {
      var b = rows[i];
      var r = stars(b.rating);
      var mat = b.material ? '<a href="' + esc(b.material) + '" target="_blank" rel="noopener">资料</a>' : "";
      var author = b.authorId ? '<a href="../../authors/' + esc(b.authorId) + '/README.html">' + esc(b.author) + "</a>" : esc(b.author);
      var name = b.bookId ? '<a href="../../authors/' + esc(b.authorId) + '/' + esc(b.bookId) + '/README.html">' + esc(b.name) + "</a>" : esc(b.name);
      var blcell = "";
      html += "<tr>" +
        "<td>" + name + "</td>" +
        "<td>" + author + "</td>" +
        "<td>" + esc(b.genre) + "</td>" +
        '<td class="num">' + b.count + "</td>" +
        '<td class="num">' + r + "</td>" +
        "<td>" + mat + "</td>" +
        blcell +
        "</tr>";
    }
    $tbody.innerHTML = html || '<tr><td colspan="6" class="empty">没有匹配的书</td></tr>';
  }
  $ths.forEach(function (th) {
    th.addEventListener("click", function () {
      var k = th.getAttribute("data-k");
      if (S.key === k) S.asc = !S.asc; else { S.key = k; S.asc = true; }
      $ths.forEach(function (t) {
        t.classList.toggle("sorted", t === th);
        t.querySelector(".bk-sort").textContent = (t === th) ? (S.asc ? "▲" : "▼") : "";
      });
      render();
    });
  });
  $search.addEventListener("input", function () { S.q = $search.value; render(); });
  render();
})();
</script>

</div>
