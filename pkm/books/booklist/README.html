<script>
(function () {
  "use strict";
  var PB = window.PKMBooks;
  var DATA = window.PKM_BOOKLISTS || [];
  var S = { q: "", group: "", key: "", asc: true };
  var $search = document.getElementById("bl-search");
  var $group = document.getElementById("bl-group");
  var $tbody = document.querySelector("#bl-table tbody");
  var $ths = Array.prototype.slice.call(document.querySelectorAll("#bl-table th[data-k]"));
  function filtered() {
    var q = S.q.trim().toLowerCase();
    return DATA.filter(function (bl) {
      if (S.group && bl.parent !== S.group && bl.id !== S.group) return false;
      if (q && (bl.name + " " + bl.id + " " + bl.parent).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
  }
  function makeRow(bl) {
    var parent = bl.parent ? '<a href="' + PB.esc(bl.parent) + '/README.html">' + PB.esc(bl.parent) + "</a>" : "";
    var cls = bl.parent ? "bl-child" : "bl-root";
    return "<tr>" +
      '<td class="' + cls + '"><a href="' + PB.esc(bl.id) + '/README.html">' + PB.esc(bl.name) + "</a></td>" +
      "<td>" + parent + "</td>" +
      "<td>" + PB.esc(bl.id) + "</td>" +
      '<td class="num">' + bl.count + "</td>" +
      "</tr>";
  }
  function render() {
    var rows = PB.sort(filtered(), S);
    PB.fill($tbody, rows, makeRow, '<tr><td colspan="4" class="empty">没有匹配的口径</td></tr>');
  }
  PB.bindSort($ths, S, render);
  $search.addEventListener("input", function () { S.q = $search.value; render(); });
  $group.addEventListener("change", function () { S.group = $group.value; render(); });
  render();
})();
</script>
