<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>书目口径</title>
<link id="theme-css" rel="stylesheet" href="../../themes/phycat-abyss.css">
<link rel="stylesheet" href="../../ui.css?v=f124b6a0">
</head>
<body class="done">

<div id="pkm-content">

<style>
.pkm-books { max-width: 1500px; }
.pkm-books h1 { margin: 8px 0 4px; }
.pkm-books .pkm-books-stats { margin: 0 0 14px; font-size: 14px; opacity: .75; }
.pkm-books .pkm-books-stats b { opacity: 1; }
.pkm-books-tools { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.pkm-books-tools input, .pkm-books-tools select {
  font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 7px;
  border: 1px solid color-mix(in srgb, currentColor 35%, transparent);
  background: color-mix(in srgb, currentColor 5%, transparent);
  color: inherit; outline: none;
}
.pkm-books-tools input:focus, .pkm-books-tools select:focus {
  border-color: color-mix(in srgb, currentColor 70%, transparent);
}
/* 下拉面板原生渲染不跟随主题，显式设背景色，避免暗色主题下亮字配亮底看不清 */
.pkm-books-tools select option {
  background: var(--bg-color, #ffffff);
  color: var(--text-color, currentColor);
}
.pkm-books-tools input { min-width: 220px; flex: 1; }
.pkm-books table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.pkm-books th { text-align: left; white-space: nowrap; cursor: pointer; user-select: none;
  padding: 7px 10px; border-bottom: 2px solid color-mix(in srgb, currentColor 25%, transparent); }
.pkm-books th .bk-sort { font-size: 11px; opacity: .5; margin-left: 3px; }
.pkm-books th.sorted .bk-sort { opacity: 1; }
.pkm-books td { padding: 6px 10px; border-bottom: 1px solid color-mix(in srgb, currentColor 10%, transparent); }
.pkm-books tbody tr:hover td { background: color-mix(in srgb, currentColor 6%, transparent); }
.pkm-books td.num, .pkm-books th.num { text-align: right; }
.pkm-books .empty { text-align: center; opacity: .5; padding: 30px 0; }
</style>

<div class="pkm-books">
  <h1>书目口径</h1>
  <p class="pkm-books-stats">共 <b>20</b> 个口径</p>
  <div class="pkm-books-tools">
    <input id="bl-search" type="search" placeholder="搜索口径名称 / id…" autocomplete="off">
  </div>
  <table id="bl-table">
    <thead><tr>
      <th data-k="name" class="sorted">名称<span class="bk-sort">▲</span></th>
      <th data-k="id">id<span class="bk-sort"></span></th>
      <th data-k="count" class="num">书目数<span class="bk-sort"></span></th>
    </tr></thead>
    <tbody></tbody>
  </table>
</div>
<script>window.PKM_BOOKLISTS = [{"id": "a1", "name": "西方古代文学", "count": 93}, {"id": "a2", "name": "中世纪文学", "count": 30}, {"id": "a3", "name": "文艺复兴时期文学", "count": 30}, {"id": "a4", "name": "17世纪文学", "count": 18}, {"id": "a5", "name": "18世纪文学（启蒙运动）", "count": 44}, {"id": "a6", "name": "19世纪浪漫主义文学", "count": 63}, {"id": "a7", "name": "19世纪现实主义文学", "count": 95}, {"id": "a8", "name": "19世纪其他流派文学", "count": 11}, {"id": "a9", "name": "20世纪文学", "count": 163}, {"id": "b1", "name": "先秦文学", "count": 21}, {"id": "b2", "name": "两汉文学", "count": 34}, {"id": "b3", "name": "魏晋南北朝文学", "count": 54}, {"id": "b4", "name": "隋唐五代文学", "count": 74}, {"id": "b5", "name": "两宋与元代文学", "count": 24}, {"id": "b6", "name": "辽、金文学", "count": 8}, {"id": "b7", "name": "元代文学", "count": 21}, {"id": "b8", "name": "明清文学", "count": 34}, {"id": "b9", "name": "晚清民初文学", "count": 21}, {"id": "c0", "name": "近现代文学", "count": 262}, {"id": "d4", "name": "十七年文学(49-66)", "count": 263}];</script>
<script>
(function () {
  "use strict";
  var DATA = window.PKM_BOOKLISTS || [];
  var S = { q: "", key: "name", asc: true };
  var $search = document.getElementById("bl-search");
  var $tbody = document.querySelector("#bl-table tbody");
  var $ths = Array.prototype.slice.call(document.querySelectorAll("#bl-table th[data-k]"));
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function filtered() {
    var q = S.q.trim().toLowerCase();
    return DATA.filter(function (bl) {
      if (q && (bl.name + " " + bl.id).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
  }
  function render() {
    var rows = filtered();
    var k = S.key, asc = S.asc;
    rows.sort(function (a, b) {
      var va = a[k], vb = b[k];
      var na = typeof va === "number", nb = typeof vb === "number";
      var c;
      if (na && nb) c = va - vb;
      else if (na) c = -1;
      else if (nb) c = 1;
      else c = String(va || "").localeCompare(String(vb || ""), "zh");
      return asc ? c : -c;
    });
    var html = "";
    for (var i = 0; i < rows.length; i++) {
      var bl = rows[i];
      html += "<tr>" +
        '<td><a href="' + esc(bl.id) + '/README.html">' + esc(bl.name) + "</a></td>" +
        "<td>" + esc(bl.id) + "</td>" +
        '<td class="num">' + bl.count + "</td>" +
        "</tr>";
    }
    $tbody.innerHTML = html || '<tr><td colspan="3" class="empty">没有匹配的口径</td></tr>';
  }
  $ths.forEach(function (th) {
    th.addEventListener("click", function () {
      var k = th.getAttribute("data-k");
      if (S.key === k) S.asc = !S.asc; else { S.key = k; S.asc = true; }
      $ths.forEach(function (t) {
        t.classList.toggle("sorted", t === th);
        t.querySelector(".bk-sort").textContent = (t === th) ? (S.asc ? "▲" : "▼") : "";
      });
      render();
    });
  });
  $search.addEventListener("input", function () { S.q = $search.value; render(); });
  render();
})();
</script>

</div>
