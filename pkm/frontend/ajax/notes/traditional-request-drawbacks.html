<h2 id="_2"><strong>如何发送传统请求</strong></h2>
<ol>
<li><strong>直接在浏览器地址栏上输入URL。</strong></li>
<li><strong>点击超链接</strong></li>
<li><strong>提交form表单</strong></li>
<li><strong>使用JS代码发送请求</strong><ol>
<li><strong>window.open(url)</strong></li>
<li><strong>document.location.href = url</strong></li>
<li><strong>window.location.href = url</strong></li>
<li><strong>....</strong></li>
</ol>
</li>
</ol>

<h2 id="_3"><strong>传统请求存在的问题</strong></h2>
<ol>
<li><strong>页面全部刷新导致了用户的体验较差。</strong></li>
<li><strong>传统的请求导致用户的体验有空白期。（用户的体验是不连贯的）</strong></li>
</ol>
