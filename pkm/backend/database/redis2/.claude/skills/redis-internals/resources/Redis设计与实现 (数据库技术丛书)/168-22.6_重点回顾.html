<p>22.6 重点回顾</p>
<p>·Redis使用SDS来保存位数组。</p>
<p>·SDS使用逆序来保存位数组，这种保存顺序简化了SETBIT命令的实现，使得SETBIT命令可以在不移动现有二进制位的情况下，对位数组进行空间扩展。</p>
<p>·BITCOUNT命令使用了查表算法和variable-precision SWAR算法来优化命令的执行效率。</p>
<p>·BITOP命令的所有操作都使用C语言内置的位操作来实现。</p>
