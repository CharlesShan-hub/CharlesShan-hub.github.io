<p>6.4 降级</p>
<p>整数集合不支持降级操作，一旦对数组进行了升级，编码就会一直保持升级后的状态。</p>
<p>举个例子，对于图6-11所示的整数集合来说，即使我们将集合里唯一一个真正需要使用int64_t类型来保存的元素4294967295删除了，整数集合的编码仍然会维持INTSET_ENC_INT64，底层数组也仍然会是int64_t类型的，如图6-12所示。</p>
<p><img alt="" src="./images/00239.webp" /></p>
<p>图6-11 数组编码为INTSET_ENC_INT64的整数集合</p>
