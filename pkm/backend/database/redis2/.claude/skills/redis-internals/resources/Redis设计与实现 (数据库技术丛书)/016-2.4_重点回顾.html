<p>2.4 重点回顾</p>
<p>·Redis只会使用C字符串作为字面量，在大多数情况下，Redis使用SDS（Simple Dynamic String，简单动态字符串）作为字符串表示。</p>
<p>·比起C字符串，SDS具有以下优点：</p>
<p>1）常数复杂度获取字符串长度。</p>
<p>2）杜绝缓冲区溢出。</p>
<p>3）减少修改字符串长度时所需的内存重分配次数。</p>
<p>4）二进制安全。</p>
<p>5）兼容部分C字符串函数。</p>
