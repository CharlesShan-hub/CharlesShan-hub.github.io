<p>23.4 重点回顾</p>
<p>·Redis的慢查询日志功能用于记录执行时间超过指定时长的命令。</p>
<p>·Redis服务器将所有的慢查询日志保存在服务器状态的slowlog链表中，每个链表节点都包含一个slowlogEntry结构，每个slowlogEntry结构代表一条慢查询日志。</p>
<p>·打印和删除慢查询日志可以通过遍历slowlog链表来完成。</p>
<p>·slowlog链表的长度就是服务器所保存慢查询日志的数量。</p>
<p>·新的慢查询日志会被添加到slowlog链表的表头，如果日志的数量超过slowlog-max-len选项的值，那么多出来的日志会被删除。</p>
