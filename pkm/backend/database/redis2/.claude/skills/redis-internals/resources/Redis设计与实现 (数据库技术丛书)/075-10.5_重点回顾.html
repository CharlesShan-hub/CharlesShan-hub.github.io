<p>10.5 重点回顾</p>
<p>·RDB文件用于保存和还原Redis服务器所有数据库中的所有键值对数据。</p>
<p>·SAVE命令由服务器进程直接执行保存操作，所以该命令会阻塞服务器。</p>
<p>·BGSAVE令由子进程执行保存操作，所以该命令不会阻塞服务器。</p>
<p>·服务器状态中会保存所有用save选项设置的保存条件，当任意一个保存条件被满足时，服务器会自动执行BGSAVE命令。</p>
<p>·RDB文件是一个经过压缩的二进制文件，由多个部分组成。</p>
<p>·对于不同类型的键值对，RDB文件会使用不同的方式来保存它们。</p>
