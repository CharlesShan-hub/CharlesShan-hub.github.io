<p>第6章 整数集合</p>
<p>整数集合（intset）是集合键的底层实现之一，当一个集合只包含整数值元素，并且这个集合的元素数量不多时，Redis就会使用整数集合作为集合键的底层实现。</p>
<p>举个例子，如果我们创建一个只包含五个元素的集合键，并且集合中的所有元素都是整数值，那么这个集合键的底层实现就会是整数集合：</p>
<hr />
<blockquote>
<p>redis&gt; SADD numbers 1 3 5 7 9<br />
(integer) 5<br />
redis&gt; OBJECT ENCODING numbers<br />
"intset"  </p>
</blockquote>
<hr />
<p>在这一章，我们将对整数集合及其相关操作的实现原理进行介绍。</p>
