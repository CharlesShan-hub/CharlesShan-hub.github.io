<p>·《Pattern-Oriented Software Architecture，Volume 4:A Pattern Language for Distributed Computing》第11章中的《Reactor》一节介绍了Reactor模型的定义、实现方法和作用。</p>
<p>·《Linux System Programming，Second Edition》第2章的《Multiplexed I/O》小节和第4章的《Event Poll》小节，以及《Unix环境高级编程，第2版》的14.5节，都对I/O多路复用及其相关函数进行了介绍。</p>
