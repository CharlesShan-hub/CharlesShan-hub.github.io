<p>7.5 重点回顾</p>
<p>·压缩列表是一种为节约内存而开发的顺序型数据结构。</p>
<p>·压缩列表被用作列表键和哈希键的底层实现之一。</p>
<p>·压缩列表可以包含多个节点，每个节点可以保存一个字节数组或者整数值。</p>
<p>·添加新节点到压缩列表，或者从压缩列表中删除节点，可能会引发连锁更新操作，但这种操作出现的几率并不高。</p>
