<p>6.6 重点回顾</p>
<p>·整数集合是集合键的底层实现之一。</p>
<p>·整数集合的底层实现为数组，这个数组以有序、无重复的方式保存集合元素，在有需要时，程序会根据新添加元素的类型，改变这个数组的类型。</p>
<p>·升级操作为整数集合带来了操作上的灵活性，并且尽可能地节约了内存。</p>
<p>·整数集合只支持升级操作，不支持降级操作。</p>
