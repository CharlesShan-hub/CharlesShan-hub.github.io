<p>24.3 重点回顾</p>
<p>·客户端可以通过执行MONITOR命令，将客户端转换成监视器，接收并打印服务器处理的每个命令请求的相关信息。</p>
<p>·当一个客户端从普通客户端变为监视器时，该客户端的REDIS_MONITOR标识会被打开。</p>
<p>·服务器将所有监视器都记录在monitors链表中。</p>
<p>·每次处理命令请求时，服务器都会遍历monitors链表，将相关信息发送给监视器。</p>
