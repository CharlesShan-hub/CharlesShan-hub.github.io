<h1 id="tomcat-session-30-30">设置 Tomcat 服务器的会话(session)超时时间为 30 分钟。具体来说，如果用户在 30 分钟内没有与应用进行任何交互，其会话将被自动注销。</h1>
<p>server.tomcat.session-timeout=30</p>
