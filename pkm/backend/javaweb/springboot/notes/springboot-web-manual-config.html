<h1 id="web">Web 的手动配置(静态资源处理)</h1>
<p><strong>手动配置 web 包括两种方式：</strong></p>
<ul>
<li>第一种：配置文件方式（<strong>实际开发中，经常通过这种方式改变默认配置</strong>）<ul>
<li>通过修改<code>application.properties</code>或<code>application.yml</code>，添加<code>spring.mvc</code>和<code>spring.web</code>相关的配置。</li>
</ul>
</li>
<li>第二种：编写代码方式（<strong>实际开发中，经常通过这种方式扩展新配置</strong>）<ul>
<li><code>编写一个类</code>实现<code>WebMvcConfigurer</code>接口，并<code>对应重写</code>接口中的方法即可扩展新的配置。</li>
</ul>
</li>
</ul>
