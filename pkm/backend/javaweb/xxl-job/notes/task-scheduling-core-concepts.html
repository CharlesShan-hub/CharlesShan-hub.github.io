<h1 id="java">Java中任务调度的核心概念</h1>
<ol>
<li><strong>任务(Task)</strong>：需要被执行的代码逻辑</li>
<li><strong>触发器(Trigger)</strong>：决定任务何时执行的规则</li>
<li><strong>调度器(Scheduler)</strong>：负责管理任务和触发器，确保任务按时执行</li>
</ol>
