<h1 id="_1">什么是任务调度</h1>
<p>任务调度(Task Scheduling)是指在预定的时间或条件下自动执行特定任务的过程。在Java开发中，任务调度允许开发者安排代码在未来的某个时间点执行，或者按照固定的时间间隔重复执行。</p>
<p>简单来说，就像你设置闹钟一样：</p>
<ul>
<li>单次执行：比如设置早上7点的闹钟</li>
<li>重复执行：比如设置工作日每天早上7点的重复闹钟</li>
</ul>
