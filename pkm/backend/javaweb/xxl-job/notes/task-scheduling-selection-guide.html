<h1 id="_1">选择任务调度方式的建议</h1>
<ol>
<li><strong>简单需求</strong>：使用<code>ScheduledExecutorService</code></li>
<li><strong>Spring项目</strong>：使用<code>@Scheduled</code>注解</li>
<li><strong>复杂需求</strong>：使用<code>Quartz</code>框架</li>
<li><strong>分布式环境</strong>：考虑使用<code>Elastic-Job</code>或<code>XXL-JOB</code>等分布式任务调度框架</li>
</ol>
