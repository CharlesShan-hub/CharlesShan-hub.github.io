<h1 id="_1">使用任务调度的注意事项</h1>
<p>(面试题)</p>
<ol>
<li>任务执行时间不应过长，否则可能影响后续任务</li>
<li>考虑任务失败的重试机制</li>
<li>在分布式环境中要注意任务重复执行的问题</li>
<li>合理设置线程池大小</li>
<li>记录任务执行日志，便于排查问题</li>
</ol>
