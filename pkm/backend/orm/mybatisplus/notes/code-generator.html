<h1 id="_1">代码生成器/逆向工程</h1>
<p><code>MyBatis-Plus</code>官方为我们推荐了两种方式：</p>
<ul>
<li>第一种方式：通过自己编写代码来生成代码（<strong>可以参考官方的代码来实现</strong>）</li>
<li>第二种方式：<code>baomidou</code> 专门为<code>IDEA</code>开发了<code>MyBatis X</code>插件。</li>
</ul>
<p>首先，要安装插件<code>MyBatis X</code></p>
<p><img src="https://cdn.nlark.com/yuque/0/2025/png/21376908/1744375663041-742ea8a1-077f-4524-a555-1b025acc0d69.png" width="1311" title="" crop="0,0,1,1" id="uf2451ff2" class="ne-image" style="font-size: 16px"></p>
<p>安装插件后，在表上右键，会出现<code>MyBatisX-Generator</code>，如下图：</p>
<p><img src="https://cdn.nlark.com/yuque/0/2025/png/21376908/1744376534949-7a74a587-4cbc-4792-9fab-d963f232f0d3.png" width="362" title="" crop="0,0,1,1" id="ucdd70335" class="ne-image" style="font-size: 16px"></p>
<p>点击它：</p>
<p><img src="https://cdn.nlark.com/yuque/0/2025/png/21376908/1744377495608-9a1cae16-8a4b-4a2e-b8a7-3e26305337d0.png" width="1006" title="" crop="0,0,1,1" id="uaca33782" class="ne-image" style="font-size: 16px"></p>
<p><img src="https://cdn.nlark.com/yuque/0/2025/png/21376908/1744377544316-427d9327-819a-4065-81d3-9d63b4c236ec.png" width="968" title="" crop="0,0,1,1" id="u250650ae" class="ne-image" style="font-size: 16px"></p>
<p>就这样，代码就轻松的生成了。</p>
