<p><img alt="1757681056420-39d1bc52-55fe-4f3b-8183-b4d7ba79b166.jpeg" src="../assets/1757681056420-39d1bc52-55fe-4f3b-8183-b4d7ba79b166.webp" /></p>

<h2 id="_1">创建一个新的工程</h2>
<p>空的工程即可，然后创建一个文件，随便写点东西。</p>
<p><img alt="1766935672736-266fac79-e2f2-45a6-a4a6-a8a0aa03d943.png" src="../assets/1766935672736-266fac79-e2f2-45a6-a4a6-a8a0aa03d943.webp" /></p>

<h2 id="idea">IDEA 安装插件</h2>
<p>IDEA 默认不支持 gitee，需要额外安装 gitee 插件。</p>
<p><img alt="1766935760582-561ef09a-3fd4-4381-b826-4e87e1121464.png" src="../assets/1766935760582-561ef09a-3fd4-4381-b826-4e87e1121464.webp" /></p>
<p>安装成功后，VCS 中就有了：</p>
<p><img alt="1766935814428-d0fe6b50-4aa4-4d4a-97dc-8538de061a67.png" src="../assets/1766935814428-d0fe6b50-4aa4-4d4a-97dc-8538de061a67.webp" /></p>
