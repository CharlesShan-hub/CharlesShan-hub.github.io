<h1 id="hello-worldjava">Hello World中的java命令细节</h1>
<p>这里有一个非常重要的步骤：首先在DOS命令窗口中将路径切换到class文件所在位置。</p>
<p>然后执行以下命令：</p>
<pre lang="bash"><code class="language-bash md-fencescode">java<span class="w"> </span>类名
</code></pre>
<p>运行Java程序需要使用的命令是：java</p>
<p>java命令怎么用？java命令后面跟的是"类名"，而不是文件的路径。</p>
<p>什么是类名：A.class则类名为A；B.class则类名为B；HelloWorld.class则类名为HelloWorld</p>
<p>运行成功后，会打印一句话。</p>
