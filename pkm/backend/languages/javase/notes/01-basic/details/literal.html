<h1 id="_1">字面量</h1>
<p>Java 中，字面量指的是在程序中直接使用的数据，字面量是 Java 中最基本的表达式，不需要进行计算或转换，直接使用即可。</p>
<ul>
<li>整数型：<code>10</code>、<code>-5</code>、<code>0</code>、<code>100</code></li>
<li>浮点型：<code>3.14</code>、<code>-0.5</code>、<code>1.0</code></li>
<li>布尔型：<code>true</code>、<code>false</code></li>
<li>字符型：<code>'a'</code>、<code>'b'</code>、<code>'c'</code>、<code>'1'</code>、<code>'2'</code>、<code>'国'</code></li>
<li>字符串型：<code>"Hello"</code>、<code>"World"</code>、<code>"Java"</code>、<code>"你好呀"</code></li>
</ul>
