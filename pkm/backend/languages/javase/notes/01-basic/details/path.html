<h1 id="path-classpath">Path 与 Classpath</h1>
<ul>
<li>二者区分<ul>
<li><code>Path</code>：windows系统的环境变量</li>
<li><code>Classpath</code>：java类加载器（classloader）的环境变量，<strong>隶属于Java语言</strong>。</li>
</ul>
</li>
<li>使用<code>Classpath</code><ul>
<li><code>java Test</code>命令执行之后，JVM启动类加载器classloader，classloader会通过<code>classpath</code>中的路径查找<code>Test.class</code>文件。</li>
<li>当<code>classpath</code>没有配置的情况下，<strong>默认从当前路径下查找</strong>。 </li>
<li>当<code>classpath</code>显式得配置出来之后，则只会从配置的路径中查找，不再从当前路径下查找。</li>
</ul>
</li>
</ul>
