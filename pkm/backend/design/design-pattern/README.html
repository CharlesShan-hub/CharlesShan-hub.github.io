<h1 id="_1">设计模式</h1>
<ul>
<li><a href="singleton-pattern.html">单例模式</a>：我的理解是，通过构造器私有化，技术上的确保全局只有一个对象</li>
<li><a href="template-pattern.html">模板模式</a>：我的理解是，父类规定流程预留钩子函数，子类实现具体环节</li>
<li><a href="adaptor.html">适配器模式（与缺省适配器）</a>：我的理解是，通过接口规定调用方式，不同子类的实现利用不同的api完成，屏蔽掉不同api的差异。（缺省适配器：设计抽象类完成一部分的接口函数，让子类可以更自由的只实现部分函数）</li>
<li><a href="chain.html">责任链模式</a>：我的理解是，类似击鼓传花，总有一个类处理请求，顺序可以在xml动态配置。</li>
</ul>
