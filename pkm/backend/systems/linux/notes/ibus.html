<h1 id="ibus">ibus</h1>
<p>安装中文输入法记录</p>
<ul>
<li>fcitx和ibus是不能共存的，两者只能装其一，所以安装其中一个时最好先使用sudo apt purge命令卸载</li>
</ul>
<p>下载后只需要安装：<code>sudo apt install ibus-pinyin</code></p>
<p>然后进入设置界面去新增拼音输入法就可以了</p>
