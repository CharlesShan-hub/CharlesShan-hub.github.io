<h1 id="windows">Windows快捷键</h1>
<h2 id="_1">窗口管理</h2>
<table>
<thead>
<tr>
<th style="text-align: left;">快捷键</th>
<th style="text-align: left;">功能</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align: left;"><strong>Win + D</strong></td>
<td style="text-align: left;">显示桌面</td>
</tr>
<tr>
<td style="text-align: left;"><strong>Win + E</strong></td>
<td style="text-align: left;">打开文件资源管理器</td>
</tr>
<tr>
<td style="text-align: left;"><strong>Win + R</strong></td>
<td style="text-align: left;">打开运行窗口</td>
</tr>
<tr>
<td style="text-align: left;"><strong>Win + L</strong></td>
<td style="text-align: left;">锁屏</td>
</tr>
<tr>
<td style="text-align: left;"><strong>Alt + Tab</strong></td>
<td style="text-align: left;">应用之间的切换</td>
</tr>
</tbody>
</table>
<h2 id="_2">文本编辑</h2>
<table>
<thead>
<tr>
<th style="text-align: left;">快捷键</th>
<th style="text-align: left;">功能</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align: left;"><strong>home</strong></td>
<td style="text-align: left;">光标回到行首</td>
</tr>
<tr>
<td style="text-align: left;"><strong>end</strong></td>
<td style="text-align: left;">光标移动到行尾</td>
</tr>
<tr>
<td style="text-align: left;"><strong>ctrl + shift + left</strong></td>
<td style="text-align: left;">选中到单词开头</td>
</tr>
<tr>
<td style="text-align: left;"><strong>ctrl + shift + right</strong></td>
<td style="text-align: left;">选中到单词结尾</td>
</tr>
</tbody>
</table>
