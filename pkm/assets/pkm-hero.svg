<svg viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="hero-grad" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#3d4653"/>
<stop offset="1" stop-color="#6e7b8d"/>
</linearGradient>
<path id="hero-arc-top" d="M125 176 A175 86 0 0 1 475 176" fill="none"/>
<path id="hero-arc-bot" d="M125 176 A175 86 0 0 0 475 176" fill="none"/>
</defs>
<style>
svg{display:block;width:100%;height:auto}
.ring-outer{stroke:#6e7c92;stroke-width:1.5;fill:none;opacity:.9}
.ring-inner{stroke:#6e7c92;stroke-width:1.1;fill:none;opacity:.75;stroke-dasharray:3 4}
.mono{font-family:Didot,'Bodoni MT','Playfair Display',Georgia,'Times New Roman',serif;font-weight:600;fill:url(#hero-grad);font-size:96px;letter-spacing:8px}
.arc-text{font-family:Arial,'Helvetica Neue',sans-serif;font-size:12px;letter-spacing:5px;fill:url(#hero-grad)}
.arc-text.bot{letter-spacing:6px}
body.black .ring-outer{stroke:#6a7486;opacity:.65}
body.black .ring-inner{stroke:#6a7486;opacity:.55}
body.black .mono{fill:#e9e3d2;filter:drop-shadow(0 0 6px rgba(230,215,160,.35))}
body.black .arc-text{fill:#cfc9b8}
</style>
<ellipse class="ring-outer" cx="300" cy="172" rx="185" ry="95"/>
<ellipse class="ring-inner" cx="300" cy="172" rx="165" ry="76"/>
<text class="arc-text">
<textPath href="#hero-arc-top" startOffset="50%" text-anchor="middle">PERSONAL KNOWLEDGE MAP</textPath>
</text>
<text class="mono" x="304" y="201" text-anchor="middle">PKM</text>
<text class="arc-text bot">
<textPath href="#hero-arc-bot" startOffset="50%" text-anchor="middle">PURSUE · KNOW · MASTER</textPath>
</text>
</svg>
