<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="goldL" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8a6400"/>
      <stop offset="30%" stop-color="#d4a437"/>
      <stop offset="55%" stop-color="#fff8dc"/>
      <stop offset="80%" stop-color="#e8c252"/>
      <stop offset="100%" stop-color="#a67c00"/>
    </linearGradient>

    <linearGradient id="goldR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a67c00"/>
      <stop offset="30%" stop-color="#f5d76e"/>
      <stop offset="55%" stop-color="#fffdf0"/>
      <stop offset="80%" stop-color="#d4a437"/>
      <stop offset="100%" stop-color="#8a6400"/>
    </linearGradient>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <g id="ribbon-left">
      <path d="M 62 230
               C 47 212, 47 192, 62 174
               C 77 156, 77 136, 62 118
               C 54 106, 58 86, 72 60
               L 72 62
               C 60 90, 56 110, 64 122
               C 80 140, 80 160, 60 178
               C 40 196, 40 218, 62 240 Z"
            fill="url(#goldL)" filter="url(#glow)"/>

      <g fill="url(#goldL)" opacity="0.85" filter="url(#glow)">
        <path transform="rotate(-25 44 132)" d="M 44 129 L 45.5 132 L 48.5 132 L 46 134.5 L 47 137.5 L 44 136 L 41 137.5 L 42 134.5 L 39.5 132 L 42.5 132 Z"/>
        <path transform="rotate(40 68 104)" d="M 68 101 L 69.5 104 L 72.5 104 L 70 106.5 L 71 109.5 L 68 108 L 65 109.5 L 66 106.5 L 63.5 104 L 66.5 104 Z"/>
        <path transform="rotate(-10 36 86)" d="M 36 83 L 37.5 86 L 40.5 86 L 38 88.5 L 39 91.5 L 36 90 L 33 91.5 L 34 88.5 L 31.5 86 L 34.5 86 Z"/>
      </g>
    </g>

    <g id="ribbon-right">
      <path d="M 62 230
               C 47 212, 47 192, 62 174
               C 77 156, 77 136, 62 118
               C 54 106, 58 86, 72 60
               L 72 62
               C 60 90, 56 110, 64 122
               C 80 140, 80 160, 60 178
               C 40 196, 40 218, 62 240 Z"
            fill="url(#goldR)" filter="url(#glow)"/>

      <g fill="url(#goldR)" opacity="0.85" filter="url(#glow)">
        <path transform="rotate(30 66 110)" d="M 66 107 L 67.5 110 L 70.5 110 L 68 112.5 L 69 115.5 L 66 114 L 63 115.5 L 64 112.5 L 61.5 110 L 64.5 110 Z"/>
        <path transform="rotate(-35 58 68)" d="M 58 65 L 59.5 68 L 62.5 68 L 60 70.5 L 61 73.5 L 58 72 L 55 73.5 L 56 70.5 L 53.5 68 L 56.5 68 Z"/>
        <path transform="rotate(20 46 50)" d="M 46 47 L 47.5 50 L 50.5 50 L 48 52.5 L 49 55.5 L 46 54 L 43 55.5 L 44 52.5 L 41.5 50 L 44.5 50 Z"/>
      </g>
    </g>
  </defs>

  <rect width="300" height="300" fill="#1a1512"/>

  <use href="#ribbon-left" transform="translate(1, -3) rotate(180, 62, 150) rotate(-5, 62, 150)"/>
  <use href="#ribbon-right" transform="rotate(270, 150, 150) scale(-1, 1) translate(-300, 0) translate(1, -3) rotate(180, 62, 150) rotate(-5, 62, 150)"/>

  <!-- 中心大星星：旋转 23 度 -->
  <path transform="rotate(23 63 63)"
        d="M 63 43 L 69 58 L 85 58 L 72 68 L 77 84 L 63 74 L 49 84 L 54 68 L 41 58 L 57 58 Z"
        fill="url(#goldL)" opacity="0.9" filter="url(#glow)"/>
</svg>