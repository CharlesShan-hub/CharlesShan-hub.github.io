<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 60" width="600" height="60">
  <defs>
    <linearGradient id="goldL" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8a6400"/>
      <stop offset="30%" stop-color="#d4a437"/>
      <stop offset="55%" stop-color="#fff8dc"/>
      <stop offset="80%" stop-color="#e8c252"/>
      <stop offset="100%" stop-color="#a67c00"/>
    </linearGradient>

    <linearGradient id="goldR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a67c00"/>
      <stop offset="30%" stop-color="#f5d76e"/>
      <stop offset="55%" stop-color="#fffdf0"/>
      <stop offset="80%" stop-color="#d4a437"/>
      <stop offset="100%" stop-color="#8a6400"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 左侧曲线 -->
  <path d="M 40 30
           C 100 18, 160 42, 220 30
           C 240 26, 250 30, 260 30"
        fill="none" stroke="url(#goldL)" stroke-width="1.8"
        stroke-linecap="round" filter="url(#glow)"/>

  <!-- 右侧曲线 -->
  <path d="M 560 30
           C 500 18, 440 42, 380 30
           C 360 26, 350 30, 340 30"
        fill="none" stroke="url(#goldR)" stroke-width="1.8"
        stroke-linecap="round" filter="url(#glow)"/>

  <!-- 中间爱心 + 两侧小点 -->
  <g filter="url(#glow)">
    <!-- 爱心外轮廓 -->
    <path d="M 300 40
             C 288 32, 284 24, 290 20
             C 294 17, 299 19, 300 23
             C 301 19, 306 17, 310 20
             C 316 24, 312 32, 300 40 Z"
          fill="none" stroke="url(#goldR)" stroke-width="1.6"/>
    <!-- 爱心内部填充 -->
    <path d="M 300 36
             C 292 30, 289 25, 293 22
             C 296 20, 299 22, 300 25
             C 301 22, 304 20, 307 22
             C 311 25, 308 30, 300 36 Z"
          fill="url(#goldL)" opacity="0.9"/>
    <!-- 两侧小点 -->
    <circle cx="272" cy="30" r="2" fill="url(#goldL)"/>
    <circle cx="328" cy="30" r="2" fill="url(#goldR)"/>
  </g>
</svg>
