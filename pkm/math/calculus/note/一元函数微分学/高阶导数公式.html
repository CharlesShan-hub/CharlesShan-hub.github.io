<h1 id="_1">高阶导数</h1>
<p>$$(\frac{1}{1-x})^{(n)}=\frac{n!}{(1-x)^{n+1}}$$
$$(\frac{1}{1+x})^{(n)}=\frac{(-1)^{n}n!}{(1-x)^{n+1}}$$
$$(\sin kx)^{(n)} = k^n \sin(kx + \frac{n}{2}\pi)$$
$$(\cos kx)^{(n)} = k^n \cos(kx + \frac{n}{2}\pi)$$</p>
