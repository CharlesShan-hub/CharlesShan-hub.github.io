<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>跳转中…</title>
<style>
body { display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0;
       font: 14px/1.6 system-ui, sans-serif; color: #666; }
</style>
</head>
<body>
<p id="msg">跳转中…</p>
<script>
(function () {
  var msg = document.getElementById('msg');
  var code = new URLSearchParams(location.search).get('short');
  if (!code) { msg.textContent = '缺少 short 参数'; return; }
  fetch('../short-map.json')
    .then(function (r) { return r.json(); })
    .then(function (map) {
      var target = map && map[code];
      if (target) { location.replace('../' + target); }
      else { msg.textContent = '短链无效: ' + code; }
    })
    .catch(function () { msg.textContent = '短链映射加载失败'; });
})();
</script>
</body>
</html>
