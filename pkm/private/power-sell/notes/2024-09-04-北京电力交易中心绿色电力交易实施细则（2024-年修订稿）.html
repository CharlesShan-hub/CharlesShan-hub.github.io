<style>
body.locked{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:#0f1216 radial-gradient(1200px 600px at 70% 20%,rgba(240,205,120,.08),transparent 60%),
  radial-gradient(900px 500px at 20% 80%,rgba(120,140,190,.10),transparent 60%)}
#pkm-lock .pkm-lock-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(14px);border-radius:16px;padding:36px 40px;width:min(360px,84vw);
  text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.35)}
#pkm-lock h1{margin:0 0 6px;font-size:22px;color:#e8e4da;letter-spacing:2px}
#pkm-lock p{margin:0 0 18px;font-size:13px;color:rgba(232,228,218,.6)}
#pkm-lock input{width:100%;box-sizing:border-box;padding:10px 14px;border-radius:8px;
  border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.25);color:#f2efe6;
  font-size:15px;outline:none}
#pkm-lock input:focus{border-color:rgba(240,205,120,.55)}
#pkm-lock button{margin-top:12px;width:100%;padding:10px;border:0;border-radius:8px;cursor:pointer;
  background:linear-gradient(135deg,#d4a437,#8a6400);color:#1a1512;font-size:15px;font-weight:600;letter-spacing:3px}
#pkm-lock button:hover{filter:brightness(1.1)}
#pkm-lock button:disabled{opacity:.5;cursor:default}
#pkm-lock #pkm-remember-box{display:flex;align-items:center;justify-content:center;
  gap:6px;margin-top:14px;font-size:12px;color:rgba(232,228,218,.6);cursor:pointer;user-select:none}
#pkm-remember-box input{width:auto;margin:0;padding:0;accent-color:#d4a437}
#pkm-err{min-height:18px;margin:10px 0 0;font-size:13px;color:#ff7b6e}
/* 记住密码的自动解锁：首帧隐藏密码框，只显示轻量解锁提示，内容就绪后直接替换，不闪现密码卡片 */
html.pkm-auto #pkm-lock{display:none}
#pkm-loading{display:none;align-items:center;justify-content:center;min-height:100vh;
  font-size:14px;letter-spacing:3px;color:rgba(232,228,218,.55)}
html.pkm-auto #pkm-loading{display:flex}
#pkm-loading::after{content:'…';animation:pkmDots 1s steps(4) infinite}
@keyframes pkmDots{0%{opacity:.3}50%{opacity:1}100%{opacity:.3}}
</style>
<!-- 同步检查记住的密码（本页或最近父目录）：渲染前就隐藏密码卡片，避免自动解锁时闪一下 -->
<script>try{var p=location.pathname,q=p.split('/'),k=null,i;
if(localStorage.getItem('pkm.pass.'+p)!==null)k='pkm.pass.'+p;
else for(i=q.length-2;i>=1;i--){var d=q.slice(0,i+1).join('/'),x='pkm.pass.'+d+'/README.html';
if(localStorage.getItem(x)!==null){k=x;break}}
if(k)document.documentElement.className='pkm-auto'}catch(e){}</script>

<script>
(function () {
  var data = JSON.parse(document.getElementById('pkm-cipher').textContent);
  var content = document.body;
  var input = document.getElementById('pkm-pass');
  var btn = document.getElementById('pkm-unlock');
  var err = document.getElementById('pkm-err');
  var remember = document.getElementById('pkm-remember');
  var KEY = 'pkm.pass.' + location.pathname;
  function b64u(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  function enc(s) { return btoa(unescape(encodeURIComponent(s))); }
  function dec(s) { return decodeURIComponent(escape(atob(s))); }
  function unlock() {
    var pass = input.value;
    btn.disabled = true;
    err.textContent = '';
    crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey'])
      .then(function (km) {
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: b64u(data.salt), iterations: data.iter, hash: 'SHA-256' },
          km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      })
      .then(function (key) {
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64u(data.iv) }, key, b64u(data.cipher));
      })
      .then(function (plain) {
        if (remember.checked) { localStorage.setItem(KEY, enc(pass)); }
        else if (KEY in localStorage) { localStorage.removeItem(KEY); }
        content.innerHTML = new TextDecoder().decode(plain);
        content.className = 'done';
        
      })
      .catch(function () { document.documentElement.className = ''; err.textContent = '密码错误，请重试'; input.focus(); input.select(); })
      .finally(function () { btn.disabled = false; });
  }
  btn.addEventListener('click', unlock);
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') unlock(); });
  // 记住的密码：本页优先，其次最近的父目录；自动填入并自动尝试解锁，对了直接进入，错了留在输入框由用户手动修改
  var autoKey = KEY in localStorage ? KEY : (function () {
    var q = location.pathname.split('/');
    for (var i = q.length - 2; i >= 1; i--) {
      var x = 'pkm.pass.' + q.slice(0, i + 1).join('/') + '/README.html';
      if (x in localStorage) return x;
    }
    return null;
  })();
  if (autoKey) {
    input.value = dec(localStorage.getItem(autoKey));
    unlock();
  } else {
    input.focus();
  }
})();
</script>
