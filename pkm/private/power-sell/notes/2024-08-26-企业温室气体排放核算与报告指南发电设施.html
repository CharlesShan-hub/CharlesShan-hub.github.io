<style>
/* 锁定页：flex 双向居中（含移动端动态工具栏的 100dvh 修正）；配色跟随当前主题，
   统一引用 --lock-* 变量（由下方脚本按主题变量或实际渲染色填充，缺省为内置深色） */
body.locked{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
  background:var(--lock-bg,#0f1216);
  background-image:radial-gradient(1200px 600px at 70% 20%,color-mix(in srgb,var(--lock-fg,#e8e4da) 7%,transparent),transparent 60%),
  radial-gradient(900px 500px at 20% 80%,color-mix(in srgb,var(--lock-fg,#e8e4da) 6%,transparent),transparent 60%);
  color:var(--lock-fg,#e8e4da)}
#pkm-lock .pkm-lock-card{background:color-mix(in srgb,var(--lock-bg,#0f1216) 92%,var(--lock-fg,#e8e4da) 5%);
  border:1px solid var(--lock-bd,color-mix(in srgb,var(--lock-fg,#e8e4da) 18%,transparent));
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:16px;
  padding:36px 40px;width:min(360px,84vw);text-align:center;
  box-shadow:0 18px 50px rgba(0,0,0,.35);animation:pkmCardIn .3s ease}
@keyframes pkmCardIn{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
#pkm-lock .pkm-lock-icon{width:46px;height:46px;margin:0 auto 14px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  border:1px solid color-mix(in srgb,var(--lock-fg,#e8e4da) 25%,transparent);
  background:color-mix(in srgb,var(--lock-fg,#e8e4da) 6%,transparent)}
#pkm-lock .pkm-lock-icon svg{width:20px;height:20px;fill:none;stroke:var(--lock-fg,#e8e4da);
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#pkm-lock h1{margin:0 0 6px;font-size:22px;color:var(--lock-fg,#e8e4da);letter-spacing:2px}
#pkm-lock p{margin:0 0 18px;font-size:13px;color:var(--lock-mut,color-mix(in srgb,var(--lock-fg,#e8e4da) 60%,transparent))}
#pkm-lock input{width:100%;box-sizing:border-box;padding:10px 14px;border-radius:8px;
  border:1px solid var(--lock-bd,color-mix(in srgb,var(--lock-fg,#e8e4da) 20%,transparent));
  background:color-mix(in srgb,var(--lock-bg,#0f1216) 30%,transparent);
  color:var(--lock-fg,#f2efe6);font-size:15px;outline:none;
  transition:border-color .2s ease,box-shadow .2s ease}
#pkm-lock input:focus{border-color:color-mix(in srgb,var(--lock-fg,#e8e4da) 55%,transparent);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--lock-fg,#e8e4da) 12%,transparent)}
#pkm-lock button{margin-top:12px;width:100%;padding:10px;border:0;border-radius:8px;cursor:pointer;
  background:var(--lock-fg,#e8e4da);color:var(--lock-bg,#1a1512);
  font-size:15px;font-weight:600;letter-spacing:3px;
  transition:filter .15s ease,transform .15s ease}
#pkm-lock button:hover{filter:brightness(1.12)}
#pkm-lock button:active{transform:scale(.98)}
#pkm-lock button:disabled{opacity:.5;cursor:default}
#pkm-lock #pkm-remember-box{display:flex;align-items:center;justify-content:center;
  gap:6px;margin-top:14px;font-size:12px;color:var(--lock-mut,color-mix(in srgb,var(--lock-fg,#e8e4da) 60%,transparent));
  cursor:pointer;user-select:none}
#pkm-remember-box input{width:auto;margin:0;padding:0;accent-color:var(--lock-fg,#e8e4da)}
#pkm-err{min-height:18px;margin:10px 0 0;font-size:13px;color:#ff7b6e}
/* 记住密码的自动解锁：首帧隐藏密码框，只显示轻量解锁提示，内容就绪后直接替换，不闪现密码卡片 */
html.pkm-auto #pkm-lock{display:none}
#pkm-loading{display:none;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;
  font-size:14px;letter-spacing:3px;color:color-mix(in srgb,var(--lock-fg,#e8e4da) 55%,transparent)}
html.pkm-auto #pkm-loading{display:flex}
#pkm-loading::after{content:'…';animation:pkmDots 1s steps(4) infinite}
@keyframes pkmDots{0%{opacity:.3}50%{opacity:1}100%{opacity:.3}}
/* 解锁后重建的 TOC 按钮独立定位左上（公开页在左侧按钮组内，私密页无折叠按钮组） */
#toc-btn{position:fixed;top:10px;left:10px;z-index:1000}
</style>
