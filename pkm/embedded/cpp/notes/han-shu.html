<h1 id="_1">函数</h1>
<p>第7章 函数——C++的编程模块:函数是C++的基本编程部件。本 章重点介绍C++函数与C函数共同的特性。具体地说，复习函数定义的通用格式，了解函数原型是如何提高程序可靠性。同时，还将学习编写函数来处理数组、字符串和结构。还要学习有关递归的知识(即函数在什么情况下调用自身)以及如何用它来实现分而治之的策略。最后将介绍函数指针，它使程序员能够通过函数参数来命令函数使用另一个函数。</p>
